# 윈도우 설치 파일(exe)을 깃허브 서버에서 만들고 "릴리스"로 올리는 워크플로 (자동 업데이트용)
#
# 새 버전 내는 순서
#   1. node scripts/bump.mjs 2.6.0 "제목" "변경1" "변경2"   (버전·이력 갱신)
#   2. git commit -am "v2.6.0" && git tag v2.6.0 && git push && git push --tags
#   3. 몇 분 뒤 저장소 Releases 에 SmartBoard_2.6.0_x64-setup.exe / .sig / latest.json 이 올라감
#   4. 설치된 앱은 시작할 때(그리고 6시간마다) latest.json 을 확인해 스스로 업데이트
#
# 준비(한 번만): 저장소 Settings → Secrets and variables → Actions → New repository secret
#   이름 TAURI_SIGNING_PRIVATE_KEY, 값은 src-tauri/updater.key 파일 내용 전체
#
# Actions 탭 → "Windows 설치 파일 빌드 · 릴리스" → Run workflow 로 태그 없이도 실행할 수 있음
name: Windows 설치 파일 빌드 · 릴리스

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 빌드 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm 패키지 설치
        run: npm ci

      - name: 릴리스 본문 만들기 (변경 이력)
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            node scripts/release-notes.mjs
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Tauri 빌드 + 릴리스 올리기 (setup.exe · .sig · latest.json)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 자동 업데이트 서명키 (Settings → Secrets → Actions 에 updater.key 내용을 TAURI_SIGNING_PRIVATE_KEY 로 등록)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: "하루이음 v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

      - name: 설치 파일 업로드 (Actions 실행 페이지 하단 Artifacts 에서도 다운로드 가능)
        uses: actions/upload-artifact@v4
        with:
          name: SmartBoard-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
