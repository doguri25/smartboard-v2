# 윈도우 설치 파일(exe)을 깃허브 서버에서 만들고 "릴리스"로 올리는 워크플로 (자동 업데이트용)
#
# 새 버전 내는 순서
#   1. node scripts/bump.mjs 2.6.0 "제목" "변경1" "변경2"   (버전·이력 갱신)
#   2. git add -A && git commit -m "v2.6.0" && git push
#   3. main 에 올라온 버전(package.json)의 릴리스가 아직 없으면 자동으로 빌드해 v2.6.0 릴리스를 만듦
#      (이미 있는 버전이면 건너뜀 → 문서만 고친 push 는 릴리스를 만들지 않음)
#   4. 몇 분 뒤 저장소 Releases 에 SmartBoard_2.6.0_x64-setup.exe / .sig / latest.json 이 올라감
#   5. 설치된 앱은 시작할 때(그리고 6시간마다) latest.json 을 확인해 스스로 업데이트
#
# 준비(한 번만): 저장소 Settings → Secrets and variables → Actions → New repository secret
#   이름 TAURI_SIGNING_PRIVATE_KEY, 값은 src-tauri/updater.key 파일 내용 전체
#
# Actions 탭 → "Windows 설치 파일 빌드 · 릴리스" → Run workflow 로 태그 없이도 실행할 수 있음
name: Windows 설치 파일 빌드 · 릴리스

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: 이 버전의 릴리스가 이미 있는지 확인
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "수동 실행/태그 → 빌드"
          elif gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "v$VERSION 릴리스가 이미 있음 → 건너뜀"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "v$VERSION 릴리스 없음 → 빌드"
          fi

      - name: Node.js 설치
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust 설치
        if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 빌드 캐시
        if: steps.check.outputs.skip != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm 패키지 설치
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: 릴리스 본문 만들기 (변경 이력)
        if: steps.check.outputs.skip != 'true'
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            node scripts/release-notes.mjs
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Tauri 빌드 + 릴리스 올리기 (setup.exe · .sig · latest.json)
        if: steps.check.outputs.skip != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 자동 업데이트 서명키 (Settings → Secrets → Actions 에 updater.key 내용을 TAURI_SIGNING_PRIVATE_KEY 로 등록)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: "하루이음 v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

      - name: 설치 파일 업로드 (Actions 실행 페이지 하단 Artifacts 에서도 다운로드 가능)
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SmartBoard-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
